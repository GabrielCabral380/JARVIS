services:
  - type: web
    name: jarvis-cloud
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: npm install && pip install edge-tts || python3 -m pip install edge-tts
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_SITE_URL
        value: https://gabrielcabral380.github.io/JARVIS/
      - key: OPENROUTER_SITE_NAME
        value: JARVIS Cloud Access
      - key: AUTO_OPEN_BROWSER
        value: false
      - key: APPROVAL_POLICY
        value: once
      - key: LOCAL_TOOLS_ENABLED
        value: false
      - key: LOCAL_TOOLS_REQUIRE_CONFIRMATION
        value: false
      - key: HERMES_ENABLED
        value: false
      - key: OPENCLAW_ENABLED
        value: false
      - key: MCP_ENABLED
        value: false
